[project]
name = "boxcode"
dynamic = ["version"]
description = "A command-line coding agent whose every command runs inside a macOS Seatbelt sandbox"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "openai>=1.60",
    "pydantic>=2.9",
    "typer>=0.15",
    "rich>=13.9",
    "anthropic>=1.0",
    "regex>=2024.11.6",
]

[project.scripts]
boxcode = "boxcode.cli:app"

[project.optional-dependencies]
gui = [
    "pywebview>=6.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "pywebview>=6.2.1",
    "types-regex>=2026.9.29.20261030",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/boxcode/__init__.py"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "PTH", "PERF", "RUF",
    "S",  # bandit：安全相关的写法
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # 中文注释和文案里的全角标点
    "S101",  # assert 用在类型收窄上
    "S603",  # subprocess 的参数都是列表，并且只在 sandbox/ 里调用
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/boxcode", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = ["macos: needs macOS sandbox-exec (skipped elsewhere)"]
