name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # 沙盒测试要真实启动 sandbox-exec，只能在 macOS 上跑
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest -q
