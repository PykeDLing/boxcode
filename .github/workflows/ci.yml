name: CI

on:
  push:
  pull_request:

# 只读权限就够了：CI 不需要往仓库写东西
permissions:
  contents: read

# 同一个分支推了新提交，取消还在跑的旧任务
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 沙盒测试要真实启动 sandbox-exec，只能在 macOS 上跑
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --locked：uv.lock 和 pyproject.toml 对不上就失败，而不是悄悄重新解析依赖
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run mypy
      - run: uv run pytest -q
